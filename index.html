<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Santa's Gift Draw</title>
  <meta name="description" content="Draw names for a Christmas gift exchange. Brothers and sisters never draw each other, and every draw plays out in Santa's elf workshop.">
  <meta name="theme-color" content="#0f2150">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://christmas-names.keslert.com/">
  <meta property="og:title" content="Santa's Gift Draw">
  <meta property="og:description" content="Draw names for a Christmas gift exchange. Brothers and sisters never draw each other, and every draw plays out in Santa's elf workshop.">
  <meta property="og:image" content="https://christmas-names.keslert.com/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Santa's Matchmaker machine popping out a gift: From Cupid, gives a gift to Blitzen.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&family=Nunito:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <div id="scene"></div>
    <canvas id="front"></canvas>
  </div>

  <div class="hud">
    <button id="skip" hidden>Skip to the list ▸▸</button>
    <button id="sound"></button>
  </div>

  <section class="screen" id="setup">
    <div class="screen-inner">
      <div class="eyebrow">Santa's Workshop</div>
      <h1>Santa's Gift Draw</h1>
      <p class="lede">
        Put one household on each line, with commas between brothers and sisters.
        People on the same line never draw each other. The draws run in order, left to right.
      </p>
      <div class="draws" id="draws"></div>
      <div class="screen-actions">
        <button class="btn primary" id="start">Start the draw ✦</button>
        <button class="btn" id="add">Add a draw</button>
        <span class="spacer"></span>
        <button class="link" id="last" hidden>See the last matches</button>
        <button class="link" id="reset">Start over</button>
      </div>
    </div>
  </section>

  <section class="screen" id="summary" hidden>
    <div class="screen-inner">
      <div class="eyebrow">Santa's Nice List</div>
      <h1>Every match</h1>
      <div class="summary-grid" id="summary-grid"></div>
      <div class="screen-actions">
        <button class="btn primary" id="print">Print</button>
        <button class="btn" id="back">Back to the lists</button>
      </div>
    </div>
  </section>

  <script src="draw.js"></script>
  <script src="sound.js"></script>
  <script src="scenery.js"></script>
  <script src="show.js"></script>
  <script src="app.js"></script>
</body>
</html>
